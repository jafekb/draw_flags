<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's That Flag?</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flags" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Minimal Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900">What's That Flag?</h1>
      <nav class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-medium" aria-label="Primary">
        <button id="tab-study" class="tab-btn px-3 py-1 rounded-lg transition bg-white text-slate-900 shadow-xs">Study</button>
        <button id="tab-browse" class="tab-btn px-3 py-1 rounded-lg transition text-slate-600 hover:text-slate-900">Browse</button>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-4 space-y-4">

    <!-- STUDY VIEW -->
    <section id="view-study" class="space-y-3">
      <!-- Compact Controls & Score Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-xl">
          <button id="mode-flag-to-name" class="px-2.5 py-1 rounded-lg bg-slate-900 text-white font-medium">Flag → Name</button>
          <button id="mode-name-to-flag" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 font-medium">Name → Flag</button>
          <button id="mode-mixed" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 font-medium">Mixed</button>
        </div>

        <div class="flex items-center gap-3 text-slate-600 font-medium">
          <span>Score: <strong id="stat-score" class="text-slate-900">0/0</strong></span>
          <span>Streak: <strong id="stat-streak" class="text-indigo-600">0</strong></span>
          <span>Mastered: <strong id="stat-mastered" class="text-emerald-600">0/0</strong></span>
        </div>
      </div>

      <!-- Quiz Card -->
      <div id="study-card-area" class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-7 shadow-xs">
        <!-- Populated dynamically -->
      </div>
    </section>

    <!-- BROWSE VIEW -->
    <section id="view-browse" class="hidden space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="browse-search" type="search" placeholder="Search active bank..." class="flex-1 bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <select id="browse-group" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium">
          <option value="All">All Active Flags</option>
          <option value="national">National</option>
          <option value="us_state">US States</option>
          <option value="ca_province">Canadian Provinces</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 px-1">
        <span id="browse-count">0 flags</span>
        <div class="flex items-center gap-2">
          <button id="export-btn" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-lg">Export</button>
          <label class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-lg cursor-pointer">
            Import
            <input id="import-input" type="file" accept="application/json" class="hidden" />
          </label>
          <button id="reset-btn" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium rounded-lg">Reset</button>
        </div>
      </div>

      <div id="browse-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    </section>

  </main>

  <!-- Flag Detail Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-3 relative text-center">
      <button id="detail-close" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-base font-bold px-2">✕</button>
      <div id="detail-content" class="space-y-3"></div>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
      <h3 class="text-base font-bold text-slate-900">Reset quiz progress?</h3>
      <p class="text-sm text-slate-600">This clears your score and spaced-repetition history.</p>
      <div class="flex justify-end gap-2">
        <button id="confirm-cancel" class="px-3.5 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 rounded-xl">Cancel</button>
        <button id="confirm-ok" class="px-3.5 py-2 text-sm font-medium bg-rose-600 hover:bg-rose-700 text-white rounded-xl">Reset</button>
      </div>
    </div>
  </div>

    const STORAGE_KEY = 'whatsthatflag_binge_v1';
    const memoryFallback = {};

    function defaultStore() {
      return {
        cards: {},
        correctCount: 0,
        totalAnswered: 0,
        streak: 0,
        recentTimesMs: [],
        turnCount: 0
      };
    }

    function loadStorage() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...defaultStore(), ...JSON.parse(raw) };
      } catch (e) {}
      return memoryFallback[STORAGE_KEY] || defaultStore();
    }

    function saveStorage(data) {
      memoryFallback[STORAGE_KEY] = data;
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    // Active Bank Filter: National + US States + Canadian Provinces (excluding historical year variants)
    const VARIANT_RE = /\b(variant|ensign|standard|civil|naval|air\s+force|army|merchant|government|vertical|reverse|obverse|unofficial|proposed|alternative|construction|ratio)\b/i;

    function classifyActiveBank(f) {
      const name = (f.name || '').trim();
      const cat = (f.category || '').toLowerCase();
      const et = (f.entity_type || '').toLowerCase();
      if (/\(\d{3,4}|1[0-9]{3}|20[0-2][0-9]/.test(name)) return null;
      if (cat === 'historical') return null;
      if (VARIANT_RE.test(name) || VARIANT_RE.test(cat) || VARIANT_RE.test(et)) return null;

      if (US_STATES.has(name) && (f.category === 'subdivision' || f.entity_type === 'state')) {
        // Avoid matching the country Georgia
        if (name === 'Georgia' && f.category === 'national') return 'national';
        return 'us_state';
      }
      if (CA_PROVINCES.has(name)) return 'ca_province';
      if ((f.category || '').toLowerCase() === 'national') return 'national';
      return null;
    }

    function normalizeFlags(list) {
      const seenNames = new Set();
      const out = [];
      for (let idx = 0; idx < list.length; idx++) {
        const f = list[idx];
        if (!f || !f.name || !f.wikipedia_image_url) continue;
        const group = classifyActiveBank(f);
        if (!group) continue;

        const dedupKey = `${group}:${f.name}`;
        if (seenNames.has(dedupKey)) continue;
        seenNames.add(dedupKey);

        const colors = Object.entries(f.color_coverage || {})
          .filter(([, pct]) => pct >= 0.01)
          .sort((a, b) => b[1] - a[1])
          .map(([c]) => c);

        out.push({
          id: f.wikipedia_image_url || `${f.name}_${idx}`,
          name: f.name,
          imageUrl: f.wikipedia_image_url,
          censoredImageUrl: f.censored_image_url || null,
          wikiUrl: f.wikipedia_url || '',
          group,
          continent: f.continent || null,
          colors: colors.length ? colors : Object.keys(f.color_coverage || {}),
          layout: (f.visual && f.visual.layout) ? f.visual.layout : ''
        });
      }
      return out;
    }

    // Distraction-Aware Timing -> Automatic FSRS Rating
    function getMedianResponseMs() {
      const times = appState.store.recentTimesMs || [];
      if (times.length < 3) return 3500;
      const sorted = [...times].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function inferFsrsRating(isCorrect, elapsedMs) {
      if (!isCorrect) return { rating: 1 };

      const median = getMedianResponseMs();
      const distractionCutoff = Math.max(12000, median * 3.0);
      if (elapsedMs > distractionCutoff) return { rating: 3 };

      const times = appState.store.recentTimesMs || [];
      times.push(elapsedMs);
      if (times.length > 30) times.shift();
      appState.store.recentTimesMs = times;

      const fastCutoff = Math.min(2800, Math.max(1400, median * 0.85));
      const normalCutoff = Math.max(5800, median * 1.65);

      if (elapsedMs <= fastCutoff) return { rating: 4 };
      if (elapsedMs <= normalCutoff) return { rating: 3 };
      return { rating: 2 };
    }

    // Iteration-Based Binge Scheduler (card-step spacing + 3-streak mastery)
    function getCardState(id) {
      const existing = appState.store.cards[id];
      if (existing) return existing;
      return { id, masteryStreak: 0, reps: 0, lapses: 0, dueTurn: 0, state: 'new' };
    }

    function scheduleCard(card, rating, turnCount) {
      let { masteryStreak, reps, lapses } = card;
      let gap = 20;

      if (rating === 1) {
        // Missed -> reset mastery streak, repeat in 3 questions
        lapses += 1;
        masteryStreak = 0;
        gap = 3;
      } else if (rating === 2) {
        // Hesitant (Hard) -> keep streak, repeat in 8 questions
        gap = 8;
      } else if (rating === 3) {
        // Steady (Good or distraction-filtered) -> +1 streak, space out
        masteryStreak += 1;
        gap = 20 * masteryStreak;
      } else {
        // Fast (Easy) -> +1 streak, space further
        masteryStreak += 1;
        gap = 45 * masteryStreak;
      }

      reps += 1;
      return {
        id: card.id,
        masteryStreak,
        reps,
        lapses,
        state: masteryStreak >= 3 ? 'mastered' : 'learning',
        dueTurn: turnCount + gap
      };
    }

    function pickChoices(target, deck) {
      const sameGroup = deck.filter(f => f.group === target.group);
      const pool = sameGroup.length >= 4 ? sameGroup : deck;
      const targetColors = new Set(target.colors);

      const candidates = pool
        .filter(f => f.id !== target.id && f.name !== target.name && f.imageUrl !== target.imageUrl)
        .map(f => {
          let sim = Math.random() * 0.6;
          if (f.group === target.group) sim += 3.0;
          if (target.continent && f.continent === target.continent) sim += 1.5;
          if (target.layout && f.layout === target.layout) sim += 1.0;
          let sharedColors = 0;
          f.colors.forEach(c => { if (targetColors.has(c)) sharedColors += 1; });
          sim += sharedColors * 0.8;
          return { flag: f, sim };
        })
        .sort((a, b) => b.sim - a.sim);

      const distractors = [];
      const usedNames = new Set([target.name]);
      for (const item of candidates) {
        if (!usedNames.has(item.flag.name)) {
          usedNames.add(item.flag.name);
          distractors.push(item.flag);
          if (distractors.length === 3) break;
        }
      }

      const options = [target, ...distractors];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      return options;
    }

      showToast._t = setTimeout(() => el.classList.add('hidden'), 2200);

    function switchTab(tab) {
      appState.activeTab = tab;
      ['study', 'browse'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        btn.className = t === tab
          ? 'tab-btn px-3 py-1 rounded-lg transition bg-white text-slate-900 shadow-xs'
          : 'tab-btn px-3 py-1 rounded-lg transition text-slate-600 hover:text-slate-900';
      });
    }

    document.getElementById('tab-study').addEventListener('click', () => switchTab('study'));
    document.getElementById('tab-browse').addEventListener('click', () => switchTab('browse'));

    function isMastered(card) {
      return (card.masteryStreak || 0) >= 3;
    }

    function pickNextCard() {
      clearTimeout(appState.advanceTimer);
      const turn = appState.store.turnCount || 0;
      const deck = appState.flags;
      const due = [];
      const fresh = [];
      const waiting = [];
      let masteredCount = 0;

      deck.forEach(f => {
        const c = getCardState(f.id);
        if (isMastered(c)) {
          masteredCount += 1;
          return;
        }
        if (c.state === 'new') fresh.push(f);
        else if (c.dueTurn <= turn) due.push({ flag: f, dueTurn: c.dueTurn });
        else waiting.push({ flag: f, dueTurn: c.dueTurn });
      });

      const allMastered = deck.length > 0 && masteredCount === deck.length;
      due.sort((a, b) => a.dueTurn - b.dueTurn);
      waiting.sort((a, b) => a.dueTurn - b.dueTurn);

      if (allMastered && !appState.practiceAllMode) {
        appState.currentFlag = null;
      } else if (due.length > 0) {
        appState.currentFlag = due[0].flag;
      } else if (fresh.length > 0) {
        appState.currentFlag = fresh[Math.floor(Math.random() * fresh.length)];
      } else if (waiting.length > 0) {
        // Never hit a wall: pull the soonest unmastered card so you can keep bingeing
        appState.currentFlag = waiting[0].flag;
      } else if (appState.practiceAllMode && deck.length > 0) {
        appState.currentFlag = deck[Math.floor(Math.random() * deck.length)];
      } else {
        appState.currentFlag = null;
      }

      appState.currentDirection = appState.studyMode === 'mixed'
        ? (Math.random() < 0.5 ? 'flag-to-name' : 'name-to-flag')
        : appState.studyMode;

      appState.currentChoices = appState.currentFlag ? pickChoices(appState.currentFlag, deck) : [];
      appState.selectedChoiceId = null;
      appState.questionStartMs = performance.now();
      renderStudy(masteredCount, allMastered);
    }

    function updateStudyStats(masteredCount) {
      const correct = appState.store.correctCount || 0;
      const total = appState.store.totalAnswered || 0;
      document.getElementById('stat-score').textContent = `${correct}/${total}`;
      document.getElementById('stat-streak').textContent = appState.store.streak || 0;
      document.getElementById('stat-mastered').textContent = `${masteredCount}/${appState.flags.length}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function handleAnswer(choiceId) {
      if (appState.selectedChoiceId !== null || !appState.currentFlag) return;
      const elapsedMs = Math.max(100, performance.now() - appState.questionStartMs);
      const isCorrect = choiceId === appState.currentFlag.id;

      const inferred = inferFsrsRating(isCorrect, elapsedMs);
      const card = getCardState(appState.currentFlag.id);
      appState.store.turnCount = (appState.store.turnCount || 0) + 1;
      const updated = scheduleCard(card, inferred.rating, appState.store.turnCount);

      appState.store.cards[appState.currentFlag.id] = updated;
      appState.store.totalAnswered = (appState.store.totalAnswered || 0) + 1;
      if (isCorrect) {
        appState.store.correctCount = (appState.store.correctCount || 0) + 1;
        appState.store.streak = (appState.store.streak || 0) + 1;
      } else {
        appState.store.streak = 0;
      }
      saveStorage(appState.store);

      appState.selectedChoiceId = choiceId;

      // Update UI immediately with green/red flash, then auto-advance
      let masteredCount = 0;
      appState.flags.forEach(f => { if (isMastered(getCardState(f.id))) masteredCount += 1; });
      renderStudy(masteredCount, masteredCount === appState.flags.length);

      appState.advanceTimer = setTimeout(() => {
        pickNextCard();
      }, isCorrect ? 120 : 950);
    }

    function renderStudy(masteredCount = 0, allMastered = false) {
      updateStudyStats(masteredCount);
      const container = document.getElementById('study-card-area');
      const flag = appState.currentFlag;

      if (!flag) {
        container.innerHTML = allMastered ? `

        ` : `

        `;
        document.getElementById('practice-anyway-btn').addEventListener('click', () => {
          appState.practiceAllMode = true;
          pickNextCard();
        });
        return;
      }

      const answered = appState.selectedChoiceId !== null;
      const wikiLinkHtml = flag.wikiUrl
        ? `<a href="${escapeHtml(flag.wikiUrl)}" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 underline underline-offset-2">Wikipedia ↗</a>`
        : '';

      const promptHtml = appState.currentDirection === 'flag-to-name'
        ? `
          <div class="w-full flex flex-col items-center gap-2 py-1">
            <img src="${escapeHtml(flag.censoredImageUrl || flag.imageUrl)}" alt="Identify this flag" class="max-h-48 sm:max-h-56 w-auto rounded-lg border border-slate-200 shadow-xs bg-slate-100 object-contain" />

          </div>
        `
        : `
          <div class="py-2 space-y-1">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${escapeHtml(flag.name)}</h2>
            ${wikiLinkHtml}
          </div>
        `;

      const choicesHtml = appState.currentDirection === 'flag-to-name'
        ? `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full max-w-xl mx-auto">
            ${appState.currentChoices.map(opt => {
              let cls = 'bg-slate-50 hover:bg-indigo-50 border-slate-200 hover:border-indigo-300 text-slate-800';
              if (answered) {
                if (opt.id === flag.id) cls = 'bg-emerald-500 border-emerald-600 text-white';
                else if (opt.id === appState.selectedChoiceId) cls = 'bg-rose-500 border-rose-600 text-white';
                else cls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
              }
              return `
                <button data-choice-id="${escapeHtml(opt.id)}" ${answered ? 'disabled' : ''} class="choice-btn px-4 py-3.5 rounded-xl border text-sm font-semibold text-left transition duration-150 ${cls}">
                  ${escapeHtml(opt.name)}
                </button>
              `;
            }).join('')}
          </div>
        `
        : `
          <div class="grid grid-cols-2 gap-3 w-full max-w-lg mx-auto">
            ${appState.currentChoices.map(opt => {
              let cls = 'bg-slate-50 hover:bg-indigo-50 border-slate-200 hover:border-indigo-300';
              if (answered) {
                if (opt.id === flag.id) cls = 'bg-emerald-100 border-emerald-500 ring-4 ring-emerald-500';
                else if (opt.id === appState.selectedChoiceId) cls = 'bg-rose-100 border-rose-500 ring-4 ring-rose-500';
                else cls = 'bg-slate-50 border-slate-200 opacity-40';
              }
              return `
                <button data-choice-id="${escapeHtml(opt.id)}" ${answered ? 'disabled' : ''} class="choice-btn p-2.5 rounded-xl border transition duration-150 flex items-center justify-center h-28 sm:h-32 ${cls}">
                  <img src="${escapeHtml(opt.censoredImageUrl || opt.imageUrl)}" alt="Flag choice" class="max-h-full max-w-full object-contain rounded-xs" />
                </button>
              `;
            }).join('')}
          </div>
        `;

      container.innerHTML = `
        <div class="flex flex-col items-center text-center space-y-5">
          ${promptHtml}
          ${choicesHtml}
        </div>
      `;

      container.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => handleAnswer(btn.dataset.choiceId));
      });
    }

      appState.studyMode = mode;

        'mixed': 'mode-mixed'

      Object.entries(map).forEach(([m, id]) => {
        const el = document.getElementById(id);

      });
      pickNextCard();
    }

    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appState.store, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `whatsthatflag-backup.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup exported');
    });

    document.getElementById('import-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && typeof parsed.cards === 'object') {
            appState.store = { ...defaultStore(), ...parsed };
            saveStorage(appState.store);
            pickNextCard();
            showToast('Progress imported');
          } else {
            showToast('Invalid backup file');
          }
        } catch (err) {
          showToast('Could not read JSON file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
