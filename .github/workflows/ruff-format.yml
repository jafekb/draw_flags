name: Ruff format check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  ruff_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Ruff format check
        run: ruff format --check .
